# 在现有 80 端口 server 块内 include 此文件。
# /xunshi 静态目录为发布脚本维护的符号链接，不改变主站根目录。
location = /xunshi {
    return 308 /xunshi/;
}

# 独立 API 入口保留后端 /api 前缀，长扫描不受主站 60 秒超时限制。
location ^~ /xunshi/api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
}

# ^~ 避免主站的 css/js 正则 location 接管循势资源。
location ^~ /xunshi/assets/ {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /xunshi/index.html {
    root /var/www;
    add_header Cache-Control "no-cache";
}

location ^~ /xunshi/ {
    root /var/www;
    try_files $uri $uri/ /xunshi/index.html;
    add_header Cache-Control "no-cache";
}
